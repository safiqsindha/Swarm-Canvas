# Redesigned study arm (swarm-size sweep, N=2). agents.type is random so this runs offline with no model
# calls. For a live run swap `agents.type` to `llm`; the pinned free model below is then used.
# Fixed team allowance: 32 paints per round, so each of the 2 agents gets 16.
# The target is split into 2 fragments; comms are SwarmChat as in redesign_split_comms.yaml.
condition: redesign_size_2
run_code: rdz2
seed: 1
rounds: 24
grid:
  cols: 24
  rows: 16
agents:
  count: 2
  handles: [a1, a2]
  type: random
paint_budget_per_round: 16
palette: [S, W, Y, B, w, P, G, K]
# Catalog is parked in the redesign study: no catalog text in prompts, requests rejected.
supplier:
  catalog: [O, R, Gy, L]
  swarm_budget: 0
  enabled: false
stop_action: true
comms:
  kind: swarmchat
  messages_per_round: 2
  max_chars: 200
  acks_enabled: true
  inbox_context_lines: 20
  server_url: ''
  backend: local
model:
  provider: openrouter
  name: nvidia/nemotron-3.5-super-vl:free
  temperature: 0.2
  max_tokens: 1600
  reasoning_enabled: false
output_dir: runs/
task:
  mode: reconstruction
  target: targets/sun_boat.txt
  prefill_background: [S, W]
  reference_split:
    a1: {colors: [Y, w], rows: [1, 4]}  # sky objects: sun and cloud
    a2: {colors: [B, K, P, w], rows: [7, 13]}  # boat: hull, mast, and sail
